services:
  hub:
    image: jiuwusan/z-jellyfin-hub:${IMAGE_TAG:-latest}
    container_name: z-jellyfin-hub
    pull_policy: always
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8097:8097"
    volumes:
      - data:/data
      - secrets:/secrets
    networks:
      - wk
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
  secrets:

networks:
  wk:
    external: true
