name: z-jellyfin-hub

services:
  hub:
    image: jiuwusan/z-jellyfin-hub:${IMAGE_TAG:-latest}
    restart: always
    environment:
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:?Set the public HTTPS base URL}
      HUB_ADMIN_USER: ${HUB_ADMIN_USER:-admin}
      HUB_DATA_DIR: /data
      HUB_MASTER_KEY_FILE: /run/secrets/hub_master_key
      HUB_ADMIN_PASSWORD_FILE: /run/secrets/hub_admin_password
    expose:
      - "8080"
    volumes:
      - data:/data
    secrets:
      - hub_master_key
      - hub_admin_password
    networks:
      - wk
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:

secrets:
  hub_master_key:
    file: ./secrets/hub.key
  hub_admin_password:
    file: ./secrets/admin.password

networks:
  wk:
    external: true
